<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393">
<title>21 · Reklama koʻrib ochish</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Gelasio:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  .frame { position: absolute; inset: 0; }
  .shade { position: absolute; inset: 0; z-index: 1; background: linear-gradient(180deg, rgba(0, 0, 0, .5) 0%, rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, 0) 66%, rgba(0, 0, 0, .7) 100%); }
  .top { position: absolute; z-index: 5; top: 58px; left: var(--page-x); right: var(--page-x); display: flex; align-items: center; justify-content: space-between; }
  .top .chip { height: var(--h-chip-glass); padding: 0 var(--s-12); color: var(--text-1); background: var(--glass-bg-strong); }
  .reward { position: absolute; z-index: 5; top: 124px; left: var(--page-x); right: var(--page-x); padding: var(--s-16); border-radius: var(--r-media); }
  .reward .progress { margin-top: var(--s-12); height: 6px; }
  .adv { position: absolute; z-index: 5; left: var(--page-x); right: var(--page-x); bottom: 34px; display: flex; align-items: center; gap: var(--s-12); padding: var(--s-12); border-radius: var(--r-media); }
  .adv .art { width: 52px; height: 52px; border-radius: var(--r-tile); flex: none; }
</style>
</head>
<body>
<div class="screen grain" id="screen">
  <div class="frame art art--walk art--soft" style="--amb: var(--amb-12)"></div>
  <div class="shade"></div>
  <div class="status"><div class="status__time">9:41</div><div class="status__icons"><i class="status__sig"></i><i class="status__wifi"></i><i class="status__bat"></i></div></div>
  <div class="island"></div>

  <div class="top">
    <span class="chip">Reklama</span>
    <div class="row-flex gap-8"><span class="chip">15 soniyadan soʻng yopiladi</span><span class="cd-ring cd-ring--sm" style="--p: 0%">15</span></div>
  </div>

  <div class="reward card--glass">
    <p class="t-body-m" style="display: flex; gap: var(--s-10); align-items: flex-start"><i class="ic ic-gift c-flame"></i><span>Oxirigacha koʻring — <span class="c-flame">11-qism bepul ochiladi</span></span></p>
    <div class="progress" style="--p: 34%"><i></i></div>
    <p class="t-caption c-3" style="margin-top: var(--s-8)">Bugungi limit: 4 / 5 reklama</p>
  </div>

  <div class="adv card--glass">
    <div class="art art--portrait" style="--amb: var(--amb-14)"></div>
    <div style="flex: 1; min-width: 0"><p class="t-body-m">[Reklama beruvchi]</p><p class="t-caption c-3" style="margin-top: 2px">Reklama tarmogʻi kontenti</p></div>
    <button class="btn btn--primary btn--sm">Batafsil</button>
  </div>
  <div class="home-ind"></div>
</div>
</body>
</html>
