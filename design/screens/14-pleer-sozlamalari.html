<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393">
<title>14 · Pleer sozlamalari</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Gelasio:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  .sheet { top: 148px; }
  .head { display: flex; align-items: center; justify-content: space-between; }
  .grp { margin-top: var(--s-16); }
  .grp > p { font: 500 var(--t-caption)/1 var(--f-ui); color: var(--text-3); margin-bottom: var(--s-8); }
  .grp .chip { height: var(--h-pill-xs); padding: 0 var(--s-12); font-size: var(--t-footnote); }
  .speed .gslider { color: var(--text-2); }
  .ticks { display: flex; justify-content: space-between; padding: 0 var(--s-6); margin-top: var(--s-6); font: 500 var(--t-caption)/1 var(--f-ui); color: var(--text-3); }
  .ticks b { color: var(--text-1); font-weight: 600; }
  .vipb { height: 18px; padding: 0 6px; border-radius: var(--r-thumb); background: var(--sand); color: var(--cocoa); font: 600 var(--t-tag)/18px var(--f-ui); margin-left: 4px; }
  .rows { margin-top: var(--s-16); padding: 0; }
  .rows .row { padding: 0 var(--s-16); }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="player-bg"><div class="art art--couple art--soft" style="--amb: var(--amb-01)"></div></div>
  <div class="scrim"></div>
  <div class="status"><div class="status__time">9:41</div><div class="status__icons"><i class="status__sig"></i><i class="status__wifi"></i><i class="status__bat"></i></div></div>
  <div class="island"></div>

  <section class="sheet">
    <div class="sheet__handle"></div>
    <div class="head"><h2 class="t-serif-lg">Sozlamalar</h2><button class="gbtn gbtn--sm gbtn--dark" aria-label="Yopish"><i class="ic ic-close ic--20"></i></button></div>

    <div class="grp speed"><p>Tezlik</p>
      <div class="gslider" style="--v: 20%"><div class="gslider__fill"></div><div class="gslider__dots"><i></i><i></i><i></i><i></i><i></i></div><div class="gslider__knob"></div><span><i class="ic ic-gauge ic--20"></i></span><span class="t-body-m" style="color: var(--text-1)">1.0x</span></div>
      <div class="ticks"><span>0.75x</span><b>1.0x</b><span>1.25x</span><span>1.5x</span><span>2.0x</span></div>
    </div>
    <div class="grp"><p>Sifat</p><div class="row-flex gap-8"><span class="chip chip--selected"><i class="ic ic-check"></i>Avto</span><span class="chip">480p</span><span class="chip">720p</span><span class="chip">1080p<span class="vipb">VIP</span></span></div></div>
    <div class="grp"><p>Ovoz / dublyaj</p><div class="row-flex gap-8"><span class="chip">Original</span><span class="chip chip--selected"><i class="ic ic-check"></i>Oʻzbekcha</span><span class="chip">Ruscha</span></div></div>
    <div class="grp"><p>Subtitr</p><div class="row-flex gap-8"><span class="chip">Oʻchiq</span><span class="chip chip--selected"><i class="ic ic-check"></i>Oʻzbekcha</span><span class="chip">Ruscha</span><span class="chip">Inglizcha</span></div></div>

    <div class="card rows">
      <div class="row"><i class="ic ic-play"></i><span class="row__label">Keyingi qismni avtomatik ijro etish</span><span class="toggle is-on"></span></div>
      <div class="row"><i class="ic ic-moon"></i><span class="row__label">Uyqu taymeri</span><span class="row__value">Oʻchiq</span><i class="ic ic-chev-right"></i></div>
      <div class="row"><i class="ic ic-download"></i><span class="row__label">Shu qismni yuklab olish</span><span class="vipb">VIP</span></div>
      <div class="row"><i class="ic ic-flag"></i><span class="row__label">Muammo haqida xabar berish</span><i class="ic ic-chev-right"></i></div>
    </div>
  </section>
  <div class="home-ind"></div>
</div>
</body>
</html>
