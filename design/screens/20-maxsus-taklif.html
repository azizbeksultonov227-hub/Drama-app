<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=393">
<title>20 · Maxsus taklif popup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@400;500&display=swap">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css">
<style>
  .bg { position: absolute; inset: -40px; filter: blur(30px); }
  .bg .art { position: absolute; }
  .modal { position: absolute; z-index: 70; left: var(--page-x); right: var(--page-x); top: 150px; padding: 0 var(--s-20) var(--s-20); text-align: center; }
  .modal > *:not(.ring) { position: relative; z-index: 3; }
  .ribbon { margin: 0 calc(var(--s-20) * -1); height: 40px; display: grid; place-items: center; background: var(--flame); color: var(--on-flame); font: 500 var(--t-mono)/1 var(--f-mono); letter-spacing: .3em; text-transform: uppercase; }
  .close { position: absolute !important; top: 52px; right: 14px; }
  .pct { margin-top: var(--s-24); color: var(--warm-text-1); }
  .modal .cd { justify-content: center; margin-top: var(--s-20); align-items: flex-start; }
  .cd__u { display: flex; flex-direction: column; align-items: center; gap: var(--s-6); }
  .cd__u span { font: 500 var(--t-caption)/1 var(--f-ui); color: var(--warm-text-1); }
  .modal .cd__sep { margin-top: 12px; color: var(--warm-text-1); }
  .modal .cd__box { background: var(--glass-chip); color: var(--warm-text-1); }
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="bg">
    <div class="art art--couple" style="--amb: var(--amb-01); left: 0; right: 0; top: 0; height: 500px"></div>
    <div class="art" style="--amb: var(--amb-02); left: 58px; top: 600px; width: 150px; height: 90px"></div>
    <div class="art" style="--amb: var(--amb-03); left: 230px; top: 600px; width: 150px; height: 90px"></div>
  </div>
  <div class="scrim"></div>
  <div class="status"><div class="status__time">9:41</div><div class="status__icons"><i class="status__sig"></i><i class="status__wifi"></i><i class="status__bat"></i></div></div>
  <div class="island"></div>

  <section class="modal card--warm grain">
    <div class="ring ring--card"></div>
    <div class="ribbon">Faqat bugun</div>
    <button class="gbtn gbtn--sm close" aria-label="Yopish"><i class="ic ic-close ic--20"></i></button>
    <p class="pct t-num-xl">−60%</p>
    <p class="t-body-m" style="margin-top: var(--s-12); color: var(--warm-text-1)">1 200 coin + 800 bonus</p>
    <p style="margin-top: var(--s-6)"><span class="t-footnote strike" style="color: var(--warm-text-1)">[narx] soʻm</span>  <span class="t-title-3" style="color: var(--warm-text-1)">[narx] soʻm</span></p>
    <div class="cd">
      <div class="cd__u"><span class="cd__box">02</span><span>soat</span></div><span class="cd__sep">:</span>
      <div class="cd__u"><span class="cd__box">14</span><span>daqiqa</span></div><span class="cd__sep">:</span>
      <div class="cd__u"><span class="cd__box">37</span><span>soniya</span></div>
    </div>
    <button class="btn btn--primary btn--block" style="margin-top: var(--s-24)">Taklifni olish</button>
    <button class="btn btn--text btn--block" style="color: var(--warm-text-1)">Yoʻq, rahmat</button>
    <p class="t-caption" style="color: var(--warm-text-1)">Bir martalik taklif · bonus coin 7 kun amal qiladi</p>
  </section>
  <div class="home-ind"></div>
</div>
<script src="../app.js" defer></script>
</body>
</html>
